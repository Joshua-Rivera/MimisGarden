
services:
  backend:
    build:
      context: ../backend/app
      dockerfile: Dockerfile
    container_name: mimis_backend

    ports: 
      - "8000:8000"
    

    restart: unless-stopped
  
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mimis_frontend

    ports: 
      - "5173:5173"
    
    restart: unless-stopped
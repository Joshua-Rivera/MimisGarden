services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in the root .env file}
      # Backend has no host port; only the internal proxy supplies client addresses.
      FORWARDED_ALLOW_IPS: "*"
      STORAGE_DIR: /srv/storage
      MODEL_PATH: /srv/models/plant_model_v1.pt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
    volumes:
      - garden-storage:/srv/storage
      - ./backend/app/ml/models:/srv/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
    ports:
      - "127.0.0.1:5500:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  garden-storage:
